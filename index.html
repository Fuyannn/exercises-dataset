<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>动作库 · 1324 个健身动作</title>
<meta name="description" content="1324 个健身动作，含动作演示动画、所需器械、目标肌群与分步中文教学。">
<meta name="theme-color" content="#ff4f00">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="动作库">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#ff4f00; --accent-soft:rgba(255,79,0,.10);
  --bg:#f6f6f7; --card:#fff; --elev:#fff;
  --text:#111113; --text2:#6b6b74; --text3:#9a9aa3;
  --line:#e6e6e9; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0c0c0e; --card:#17171a; --elev:#1c1c20;
    --text:#f2f2f4; --text2:#a1a1ab; --text3:#77777f;
    --line:#2a2a30; --accent-soft:rgba(255,79,0,.16);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  }
}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.55;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── 顶栏 ───────────────────────────────── */
header{
  position:sticky; top:0; z-index:20; padding:calc(var(--safe-t) + 10px) 14px 10px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(1.6) blur(14px); -webkit-backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid var(--line);
}
.bar{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:baseline;gap:7px;min-width:0;flex:1}
.brand b{font-size:18px;letter-spacing:-.02em}
.brand span{font-size:12px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{
  width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
}
.icon-btn:active{transform:scale(.94)}
.icon-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.on svg{fill:currentColor}

.search{position:relative;margin-top:10px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--text3);fill:none;stroke-width:2;stroke-linecap:round}
.search input{
  width:100%;height:42px;padding:0 38px 0 37px;font-size:16px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;outline:none;
}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--line);color:var(--text2);display:none;place-items:center;font-size:15px;line-height:1}
.search.filled .clear{display:grid}

.chips{display:flex;gap:7px;margin-top:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;height:32px;padding:0 12px;border-radius:999px;font-size:13px;white-space:nowrap;
  background:var(--card);border:1px solid var(--line);color:var(--text2);display:flex;align-items:center;gap:5px;
}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chip .cv{max-width:96px;overflow:hidden;text-overflow:ellipsis}

.meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--text3);min-height:16px}
.meta .dot{width:3px;height:3px;border-radius:50%;background:currentColor}
.spin{display:none;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
body.busy .spin{display:block}

/* ── 列表 ───────────────────────────────── */
main{padding:4px 14px calc(var(--safe-b) + 40px)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;padding-top:10px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:15px;
  overflow:hidden;box-shadow:var(--shadow);text-align:left;display:block;width:100%;
}
.card:active{transform:scale(.977)}
.thumb{width:100%;aspect-ratio:1/1;background:#fff;object-fit:contain}
@media (prefers-color-scheme:dark){.thumb{background:#f2f2f4}}
.card .body{padding:9px 10px 11px}
.card .nm{
  font-size:13.5px;font-weight:600;line-height:1.32;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px;
}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.tag{font-size:10.5px;padding:2.5px 7px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--text2);white-space:nowrap}
.tag.a{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:700}
.fav{
  position:absolute;top:7px;right:7px;width:29px;height:29px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.9);backdrop-filter:blur(4px);color:#9a9aa3;box-shadow:0 1px 4px rgba(0,0,0,.12);
}
.fav svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round}
.fav.on{color:var(--accent)} .fav.on svg{fill:currentColor}

.empty{padding:64px 24px;text-align:center;color:var(--text3)}
.empty b{display:block;font-size:15px;color:var(--text2);margin-bottom:6px}
.more{text-align:center;color:var(--text3);font-size:12.5px;padding:18px 0 6px}

.skel{border-radius:15px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.skel .a{width:100%;aspect-ratio:1/1;background:var(--bg)}
.skel .b{height:12px;margin:11px 10px;border-radius:6px;background:var(--bg);width:70%}
@media(prefers-reduced-motion:no-preference){
  .skel .a,.skel .b{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.45}}
}

/* ── 详情页 ───────────────────────────────── */
#detail{
  position:fixed;inset:0;z-index:60;background:var(--bg);
  display:flex;flex-direction:column;transform:translateY(100%);visibility:hidden;
  transition:transform .26s cubic-bezier(.32,.72,0,1),visibility .26s;
}
#detail.open{transform:none;visibility:visible}
.dhead{
  position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:9px;
  padding:calc(var(--safe-t) + 9px) 14px 9px;
  background:color-mix(in srgb,var(--bg) 84%,transparent);
  backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid var(--line);
}
.dhead .sp{flex:1}
.dhead .pg{font-size:12.5px;color:var(--text3);font-variant-numeric:tabular-nums}
.dbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(var(--safe-b) + 40px)}
.hero{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
@media (prefers-color-scheme:dark){.hero{background:#f2f2f4}}
.hero img{width:100%;aspect-ratio:1/1;object-fit:contain}
.hero .ph{width:100%;aspect-ratio:1/1;display:grid;place-items:center;color:#9a9aa3;font-size:13px;background:#fff}
h1{font-size:20px;line-height:1.3;letter-spacing:-.02em;margin-top:15px}
.sub{display:flex;align-items:center;gap:7px;margin-top:6px;flex-wrap:wrap}
.sub .id{font-size:11.5px;color:var(--text3);font-variant-numeric:tabular-nums}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px 12px}
.fact b{display:block;font-size:10.5px;color:var(--text3);font-weight:600;letter-spacing:.06em;margin-bottom:3px}
.fact span{font-size:14px;font-weight:600}
.sect{margin-top:22px}
.sect>h2{font-size:12px;color:var(--text3);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.sect>h2 .lang{margin-left:auto;text-transform:none;letter-spacing:0}
.steps{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:4px 14px;box-shadow:var(--shadow)}
.steps li{list-style:none;display:flex;gap:11px;padding:11px 0;font-size:14.5px;line-height:1.62;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps .n{
  flex:none;width:21px;height:21px;margin-top:2px;border-radius:7px;background:var(--accent-soft);color:var(--accent);
  font-size:11.5px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums;
}
.steps pre{font:inherit;white-space:pre-wrap;word-break:break-word}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12.5px;padding:5px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--text2)}
.favbig{
  margin-top:22px;width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);
  font-size:14.5px;font-weight:600;color:var(--text2);display:flex;align-items:center;justify-content:center;gap:8px;
}
.favbig.on{background:var(--accent);border-color:var(--accent);color:#fff}
.favbig svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round}
.favbig.on svg{fill:currentColor}
.note{margin-top:20px;font-size:11.5px;color:var(--text3);text-align:center;line-height:1.7}
.note a{color:var(--text2)}

/* ── 语言选择 ───────────────────────────────── */
#langsheet{position:fixed;inset:0;z-index:70;display:none}
#langsheet.open{display:block}
#langsheet .mask{position:absolute;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(2px)}
#langsheet .panel{
  position:absolute;left:0;right:0;bottom:0;background:var(--elev);border-radius:20px 20px 0 0;
  padding:16px 14px calc(var(--safe-b) + 16px);max-height:78vh;overflow-y:auto;
  animation:up .24s cubic-bezier(.32,.72,0,1);
}
@keyframes up{from{transform:translateY(100%)}}
#langsheet .ttl{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center}
#langsheet .ttl button{margin-left:auto;color:var(--text3);font-size:14px;font-weight:500;padding:4px 6px}
.langrow{display:flex;flex-wrap:wrap;gap:8px}
.langrow button{
  padding:9px 14px;border-radius:11px;background:var(--card);border:1px solid var(--line);font-size:14px;
}
.langrow button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

/* ── 筛选面板 ───────────────────────────────── */
#sheet{position:fixed;inset:0;z-index:65;display:none}
#sheet.open{display:block}
#sheet .mask{position:absolute;inset:0;background:rgba(0,0,0,.4)}
#sheet .panel{
  position:absolute;left:0;right:0;bottom:0;background:var(--elev);border-radius:20px 20px 0 0;
  padding:16px 14px calc(var(--safe-b) + 16px);max-height:80vh;display:flex;flex-direction:column;
  animation:up .24s cubic-bezier(.32,.72,0,1);
}
#sheet .ttl{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center}
#sheet .ttl button{margin-left:auto;color:var(--accent);font-size:14px;font-weight:600}
.opts{overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-wrap:wrap;gap:8px;padding-bottom:4px}
.opts button{
  display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:11px;
  background:var(--card);border:1px solid var(--line);font-size:14px;
}
.opts button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.opts button i{font-style:normal;font-size:11.5px;color:var(--text3);font-variant-numeric:tabular-nums}
.opts button.on i{color:rgba(255,255,255,.8)}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand"><b>动作库</b><span id="count"></span></div>
    <button class="icon-btn" id="btnFav" title="只看收藏" aria-label="只看收藏">
      <svg viewBox="0 0 24 24"><path d="M12 3.6l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.8l5.9-.9z"/></svg>
    </button>
    <button class="icon-btn" id="btnRandom" title="随便来一个" aria-label="随便来一个">
      <svg viewBox="0 0 24 24"><rect x="3.4" y="3.4" width="17.2" height="17.2" rx="4.2"/><circle cx="8.6" cy="8.6" r="1.35" fill="currentColor" stroke="none"/><circle cx="15.4" cy="15.4" r="1.35" fill="currentColor" stroke="none"/><circle cx="15.4" cy="8.6" r="1.35" fill="currentColor" stroke="none"/><circle cx="8.6" cy="15.4" r="1.35" fill="currentColor" stroke="none"/></svg>
    </button>
  </div>
  <div class="search" id="searchWrap">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="搜名字、器械或中文要领…" autocomplete="off" enterkeyhint="search">
    <button class="clear" id="btnClear" aria-label="清空">✕</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="meta"><span id="stat">加载中…</span><span class="spin"></span></div>
</header>

<main><div class="grid" id="grid"></div><div id="tail"></div></main>

<section id="detail" aria-hidden="true">
  <div class="dhead">
    <button class="icon-btn" id="dBack" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="sp"></span>
    <span class="pg" id="dPage"></span>
    <button class="icon-btn" id="dPrev" aria-label="上一个"><svg viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button>
    <button class="icon-btn" id="dNext" aria-label="下一个"><svg viewBox="0 0 24 24"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg></button>
  </div>
  <div class="dbody" id="dBody"></div>
</section>

<div id="sheet"><div class="mask" data-close></div><div class="panel">
  <div class="ttl"><span id="sheetTitle">筛选</span><button data-close>完成</button></div>
  <div class="opts" id="opts"></div>
</div></div>

<div id="langsheet"><div class="mask" data-close></div><div class="panel">
  <div class="ttl"><span>教学语言</span><button data-close>关闭</button></div>
  <div class="langrow" id="langrow"></div>
</div></div>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const LANGS = [['zh','中文'],['en','English'],['es','Español'],['it','Italiano'],['tr','Türkçe'],
               ['ru','Русский'],['hi','हिन्दी'],['pl','Polski'],['ko','한국어'],['fr','Français']];
const LANGNAME = Object.fromEntries(LANGS);
const PAGE = 60;

let IDX = null;            // 完整索引
let ITEMS = [];            // records
let D = {};                // 各维度中文标签字典
let HAY = [];              // 预计算的搜索串
let ZHAY = null;           // 中文要领搜索串（异步到货）
let TEXT = {};             // lang -> {id:[steps]}
let TEXTBUSY = {};
let lang = localStorage.getItem('lang') || 'zh';
let favs = new Set(JSON.parse(localStorage.getItem('favs') || '[]'));
let q = '', F = { category: '', equipment: '', target: '' }, favOnly = false;
let view = [], shown = 0, cur = -1, savedY = 0;

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const L = (kind, en) => (D[kind] && D[kind][en]) || en;
const img = (r) => `images/${r[0]}-${r[6]}.jpg`;
const gif = (r) => `videos/${r[0]}-${r[6]}.gif`;

/* ── 数据加载 ─────────────────────────────── */
async function boot() {
  try {
    const r = await fetch('data/index.json', { cache: 'force-cache' });
    IDX = await r.json();
  } catch (e) {
    $('#stat').textContent = '数据加载失败，请下拉刷新';
    return;
  }
  ITEMS = IDX.items;
  D = IDX.dicts;
  HAY = ITEMS.map((r) =>
    [r[1], r[2], r[3], r[4], r[5], (r[7] || []).join(' '), L('category', r[2]), L('equipment', r[3]),
     L('target', r[4]), L('muscle_group', r[5])].join(' ').toLowerCase());
  buildChips();
  apply();
  prefetchLang('zh');                       // 后台预取中文要领 → 打开详情/中文搜索都即时
  if (lang !== 'zh') prefetchLang(lang);
}

function prefetchLang(l) {
  if (TEXT[l] || TEXTBUSY[l]) return;
  TEXTBUSY[l] = true;
  document.body.classList.add('busy');
  fetch(`data/text.${l}.json`)
    .then((r) => r.json())
    .then((o) => {
      TEXT[l] = o;
      if (l === 'zh') { ZHAY = {}; for (const r of ITEMS) ZHAY[r[0]] = (o[r[0]] || []).join(' ').toLowerCase(); }
      if (cur >= 0) renderDetail(true);
      if (q) apply();
    })
    .catch(() => {})
    .finally(() => { TEXTBUSY[l] = false; document.body.classList.remove('busy'); });
}

/* ── 筛选 ─────────────────────────────────── */
function buildChips() {
  const box = $('#chips');
  box.innerHTML = '';
  const mk = (kind, label) => {
    const b = document.createElement('button');
    b.className = 'chip' + (F[kind] ? ' on' : '');
    b.innerHTML = `${esc(label)}<span class="cv">${esc(F[kind] ? L(kind, F[kind]) : '')}</span>`;
    b.onclick = () => {
      if (F[kind]) { F[kind] = ''; buildChips(); apply(); }
      else openSheet(kind, label);
    };
    box.appendChild(b);
  };
  mk('category', '部位'); mk('equipment', '器械'); mk('target', '目标肌');
  const b = document.createElement('button');
  b.className = 'chip' + (favOnly ? ' on' : '');
  b.textContent = '★ 收藏 ' + favs.size;
  b.onclick = () => { favOnly = !favOnly; syncFavBtn(); buildChips(); apply(); };
  box.appendChild(b);
}

function openSheet(kind, label) {
  $('#sheetTitle').textContent = label;
  const counts = {};
  for (const r of ITEMS) { const v = kind === 'category' ? r[2] : kind === 'equipment' ? r[3] : r[4]; counts[v] = (counts[v] || 0) + 1; }
  const keys = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  const box = $('#opts');
  box.innerHTML = '';
  const mk = (val, txt, n) => {
    const b = document.createElement('button');
    b.className = F[kind] === val ? 'on' : '';
    b.innerHTML = `<span>${esc(txt)}</span>${n ? `<i>${n}</i>` : ''}`;
    b.onclick = () => { F[kind] = val; closeSheets(); buildChips(); apply(); scrollTo({ top: 0 }); };
    box.appendChild(b);
  };
  mk('', '全部', ITEMS.length);
  for (const k of keys) mk(k, L(kind, k), counts[k]);
  $('#sheet').classList.add('open');
}

function closeSheets() { $('#sheet').classList.remove('open'); $('#langsheet').classList.remove('open'); }

/* ── 列表渲染 ─────────────────────────────── */
function apply() {
  const terms = qted();
  view = ITEMS.filter((r, i) => {
    if (F.category && r[2] !== F.category) return false;
    if (F.equipment && r[3] !== F.equipment) return false;
    if (F.target && r[4] !== F.target) return false;
    if (favOnly && !favs.has(r[0])) return false;
    if (!terms.length) return true;
    let hay = HAY[i];
    if (ZHAY && ZHAY[r[0]]) hay += ' ' + ZHAY[r[0]];
    return terms.every((t) => hay.includes(t));
  });
  shown = 0;
  $('#grid').innerHTML = '';
  const active = ['category', 'equipment', 'target'].filter((k) => F[k] || favOnly);
  const zhPending = terms.length && !ZHAY;
  $('#stat').innerHTML = `${view.length} 个动作${terms.length ? '（含中文要领检索）' : ''}` +
    (zhPending ? '<span class="dot"></span>中文要领还在加载，稍后自动补全' : '') +
    (favOnly ? `<span class="dot"></span>只看收藏` : '');
  render();
}
const qted = () => q.trim().toLowerCase().split(/\s+/).filter(Boolean);

function render() {
  const grid = $('#grid');
  const end = Math.min(shown + PAGE, view.length);
  if (!view.length) {
    grid.innerHTML = '';
    $('#tail').innerHTML = `<div class="empty"><b>没有匹配的动作</b>换个关键词，或清掉上面的筛选条件试试</div>`;
    return;
  }
  const frag = document.createDocumentFragment();
  for (let i = shown; i < end; i++) frag.appendChild(card(view[i], i));
  grid.appendChild(frag);
  shown = end;
  $('#tail').innerHTML = shown < view.length
    ? `<div class="more">已显示 ${shown} / ${view.length} · 继续下滑加载</div>`
    : `<div class="more">— 共 ${view.length} 个动作 —</div>`;
}

function card(r, i) {
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML =
    `<button class="fav${favs.has(r[0]) ? ' on' : ''}" data-fav="${r[0]}" aria-label="收藏">` +
      `<svg viewBox="0 0 24 24"><path d="M12 3.6l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.8l5.9-.9z"/></svg></button>` +
    `<img class="thumb" loading="lazy" decoding="async" alt="${esc(r[1])}" src="${img(r)}">` +
    `<div class="body"><div class="nm">${esc(r[1])}</div>` +
    `<div class="tags"><span class="tag a">${esc(L('category', r[2]))}</span>` +
    `<span class="tag">${esc(L('equipment', r[3]))}</span></div></div>`;
  el.onclick = (e) => {
    const f = e.target.closest('[data-fav]');
    if (f) { toggleFav(f.dataset.fav); f.classList.toggle('on'); return; }
    openDetail(i);
  };
  return el;
}

/* 滚动加载 */
let ticking = false;
addEventListener('scroll', () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    if (shown < view.length && innerHeight + scrollY > document.body.offsetHeight - 900) render();
  });
}, { passive: true });

/* ── 收藏 ─────────────────────────────────── */
function toggleFav(id) {
  if (favs.has(id)) favs.delete(id); else favs.add(id);
  localStorage.setItem('favs', JSON.stringify([...favs]));
  if (favOnly) { buildChips(); apply(); }
  else buildChips();
  if (cur >= 0) syncDetailFav();
  syncFavBtn();
}
function syncFavBtn() { $('#btnFav').classList.toggle('on', favOnly); }
function syncDetailFav() {
  const b = $('#dBody .favbig');
  if (!b || cur < 0) return;
  b.classList.toggle('on', favs.has(view[cur][0]));
  b.querySelector('span').textContent = favs.has(view[cur][0]) ? '已收藏' : '收藏这个动作';
}

/* ── 详情 ─────────────────────────────────── */
function openDetail(i) {
  cur = i;
  savedY = scrollY;
  renderDetail(false);
  $('#detail').classList.add('open');
  $('#detail').setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  history.pushState({ d: 1 }, '');
}
function closeDetail(pop) {
  $('#detail').classList.remove('open');
  $('#detail').setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  cur = -1;
  if (!pop) history.back();
  else requestAnimationFrame(() => scrollTo(0, savedY));
}
addEventListener('popstate', () => { if (cur >= 0) closeDetail(true); });

function renderDetail(keepScroll) {
  const r = view[cur];
  if (!r) return;
  const y = $('#dBody').scrollTop;
  $('#dPage').textContent = `${cur + 1} / ${view.length}`;
  const t = TEXT[lang];
  const steps = t ? t[r[0]] : null;
  const sec = (r[7] || []).map((m) => `<span class="pill">${esc(L('muscle_group', m) || m)}</span>`).join('');
  $('#dBody').innerHTML =
    `<div class="hero"><img id="dGif" alt="${esc(r[1])}" src="${gif(r)}"></div>` +
    `<h1>${esc(r[1])}</h1>` +
    `<div class="sub"><span class="id">#${esc(r[0])}</span><span class="id">·</span>` +
      `<span class="id">${esc(L('category', r[2]))} / ${esc(L('target', r[4]))}</span></div>` +
    `<div class="facts">` +
      `<div class="fact"><b>部位</b><span>${esc(L('category', r[2]))}</span></div>` +
      `<div class="fact"><b>器械</b><span>${esc(L('equipment', r[3]))}</span></div>` +
      `<div class="fact"><b>目标肌</b><span>${esc(L('target', r[4]))}</span></div>` +
      `<div class="fact"><b>主协同肌</b><span>${esc(L('muscle_group', r[5]) || r[5])}</span></div>` +
    `</div>` +
    (sec ? `<div class="sect"><h2>协同肌群</h2><div class="pills">${sec}</div></div>` : '') +
    `<div class="sect"><h2>分步要领<span class="lang">` +
      `<button class="chip on" id="dLang">${esc(LANGNAME[lang])} ▾</button></span></h2>` +
      (steps
        ? `<ol class="steps">${steps.map((s, k) => `<li><span class="n">${k + 1}</span><pre>${esc(s)}</pre></li>`).join('')}</ol>`
        : `<div class="steps"><li style="border:0"><span class="n">…</span><pre>正在加载 ${esc(LANGNAME[lang])} 教学文字…</pre></li></div>`) +
    `</div>` +
    `<button class="favbig${favs.has(r[0]) ? ' on' : ''}" id="dFav">` +
      `<svg viewBox="0 0 24 24"><path d="M12 3.6l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.8l5.9-.9z"/></svg>` +
      `<span>${favs.has(r[0]) ? '已收藏' : '收藏这个动作'}</span></button>` +
    `<div class="note">动作演示与图示 © <a href="https://gymvisual.com/" target="_blank" rel="noopener">Gym visual</a>，以 180×180 分辨率转载<br>` +
      `数据集 <a href="https://github.com/hasaneyldrm/exercises-dataset" target="_blank" rel="noopener">hasaneyldrm/exercises-dataset</a>（MIT）</div>`;
  $('#dBody').scrollTop = keepScroll ? y : 0;
  if (!steps) prefetchLang(lang);
  $('#dLang').onclick = () => { buildLangRow(); $('#langsheet').classList.add('open'); };
  $('#dFav').onclick = () => { toggleFav(r[0]); syncDetailFav(); };
}

function step(d) {
  if (cur < 0) return;
  const n = cur + d;
  if (n < 0 || n >= view.length) return;
  cur = n;
  renderDetail();
}

function buildLangRow() {
  $('#langrow').innerHTML = LANGS.map(([c, n]) =>
    `<button class="${c === lang ? 'on' : ''}" data-lang="${c}">${esc(n)}</button>`).join('');
  $('#langrow').querySelectorAll('[data-lang]').forEach((b) => {
    b.onclick = () => {
      lang = b.dataset.lang;
      localStorage.setItem('lang', lang);
      closeSheets();
      if (cur >= 0) renderDetail(true);
      prefetchLang(lang);
    };
  });
}

/* ── 事件 ─────────────────────────────────── */
$('#q').addEventListener('input', (e) => {
  q = e.target.value;
  $('#searchWrap').classList.toggle('filled', !!q);
  clearTimeout(window._t);
  window._t = setTimeout(() => { apply(); scrollTo({ top: 0 }); }, 130);
});
$('#btnClear').onclick = () => { q = ''; $('#q').value = ''; $('#searchWrap').classList.remove('filled'); apply(); $('#q').focus(); };
$('#btnFav').onclick = () => { favOnly = !favOnly; syncFavBtn(); buildChips(); apply(); };
$('#btnRandom').onclick = () => {
  const pool = view.length ? view : ITEMS;
  openDetail(Math.floor(Math.random() * pool.length));
};
$('#dBack').onclick = () => closeDetail(false);
$('#dPrev').onclick = () => step(-1);
$('#dNext').onclick = () => step(1);
document.querySelectorAll('[data-close]').forEach((el) => el.onclick = closeSheets);
addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if ($('#sheet').classList.contains('open') || $('#langsheet').classList.contains('open')) closeSheets(); else if (cur >= 0) closeDetail(false); }
  if (cur >= 0 && e.key === 'ArrowLeft') step(-1);
  if (cur >= 0 && e.key === 'ArrowRight') step(1);
});

syncFavBtn();
boot();
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
